mesa:
  description: Mesa Turnip Vulkan driver for Adreno/KGSL
  repo: https://github.com/whitebelyash/mesa-unified.git
  branch: turnip/gen8
  commit: 9c7e022677dfa3abb356c2b6732cbd2e25783d01
  output: mesa-{version}.zip
  sdk_ver: 35
  buildtype: release
  localPatches: mesa/patches

fexcore:
  description: FEXCore CPU emulation layer
  repo: https://github.com/FEX-Emu/FEX.git
  branch: FEX-2611.1
  output: fexcore-{version}.wcp
  mingw_ver: "20260519"
  preset: elitex
  localPatches: fexcore/patches

wine:
  description: Wine 11 Proton ARM64 + ARM64EC (Proton 11.0-2)
  repo: https://github.com/GameNative/proton-wine.git
  # proton_11.0-2 carries the current ARM64EC work. It moved the Android fixes
  # into android/patches/{tools,common,arm64ec}/ with a curated order (applied by
  # apply_android_patches), and replaced esync with userspace ntsync. The ntsync
  # patches are skipped until a Rust cross-toolchain is added, so this builds
  # with fsync.
  branch: proton-11.0-2-20261115
  output: wine-arm64-{version}.wcp
  mingw_ver: "20260519"
  sdk_ver: 28
  preset: elitex
  remotePatches: android/patches
  localPatches: wine/patches
  # Userspace ntsync for Android (Rust). proton_11.0-2 links this into ntdll and
  # wineserver; without it the build has no fast synchronisation path.
  ntsync_android:
    repo: https://github.com/joshuatam/ntsync-android.git
    commit: 56447e0e837c226c46035c493acabe189ceea0c7

box64:
  description: Box64 x86_64 emulator for ARM64
  repo: https://github.com/ptitSeb/box64.git
  branch: main
  output: box64-{version}.zip
  sdk_ver: 35

dxvk:
  description: DXVK 3.x upstream (dxbc-spirv) — D3D8/9/10/11 Vulkan translation layer
  repo: https://github.com/doitsujin/dxvk.git
  branch: v3.1.1
  output: "{version}-arm64ec.wcp"
  mingw_ver: "20260519"
  preset: elitex

benchmark:
  description: Vulkan GPU benchmark for Turnip driver optimization tracking
  sdk_ver: 35
  output: bench-vulkan-{version}.zip
  bench_version: "1.0.0"

winlator:
  description: Winlator Ludashi fork — Android APK builder
  repo: https://github.com/StevenMXZ/Winlator-Ludashi.git
  branch: ludashi-3.1
  output: winlator-{version}.apk

toolchain:
  arm64ec_mingw:
    description: ARM64EC-capable llvm-mingw (bylaws fork, FEX's documented toolchain)
    repo: https://github.com/bylaws/llvm-mingw
    version: "20250920"
    asset: llvm-mingw-{version}-ucrt-ubuntu-22.04-{host_arch}.tar.xz
